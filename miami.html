<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>APEX GP · Miami</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #07060b; overflow: hidden; }
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; color: #fff; font-family: "Titillium Web", "Arial Narrow", Arial, sans-serif; background: radial-gradient(120% 90% at 70% 110%, #ff3d7f 0%, #7a2a7a 28%, #1d1440 55%, #07060b 85%); transition: opacity 0.9s ease; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .lart { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease; }
      #loading .lart.in { opacity: 1; }
      #loading .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5, 4, 10, 0.86) 0%, rgba(5, 4, 10, 0.45) 45%, rgba(5, 4, 10, 0) 75%); }
      #loading .lwrap { position: absolute; left: 7vw; bottom: 14vh; width: min(520px, 80vw); }
      #loading .eyebrow { font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; color: #6ff3ff; font-weight: 700; }
      #loading .logo { margin-top: 10px; font-size: clamp(48px, 7vw, 92px); font-weight: 900; font-style: italic; line-height: 0.86; letter-spacing: -0.04em; text-transform: uppercase; }
      #loading .logo .gp { color: #ff2b3f; }
      #loading .logo .city { display: block; background: linear-gradient(90deg, #ff4f9a, #ffb36b); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #loading .sub { margin-top: 14px; font-size: 16px; color: rgba(255, 255, 255, 0.72); font-weight: 600; max-width: 440px; line-height: 1.4; }
      #loading .lbar { margin-top: 26px; height: 3px; background: rgba(255, 255, 255, 0.12); border-radius: 2px; overflow: hidden; }
      #loading .lbar b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff4f9a, #6ff3ff); transition: width 0.25s ease; }
      #loading .lstep { margin-top: 12px; font-size: 13px; color: rgba(255, 255, 255, 0.55); letter-spacing: 0.04em; font-weight: 600; }
      #loading .lerr { margin-top: 12px; color: #ff8080; font: 12px/1.4 monospace; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <div class="shade"></div>
      <div class="lwrap">
        <div class="eyebrow">Open world</div>
        <div class="logo">Apex <span class="gp">GP</span><span class="city">Miami</span></div>
        <div class="sub">Brickell to South Beach · a story of fast cars and bad debts</div>
        <div class="lbar"><b></b></div>
        <div class="lstep">Starting</div>
        <div class="lerr"></div>
      </div>
    </div>
    <script>
      // key art behind the loader (rendered in the mode itself); a missing file just leaves the gradient
      (function () {
        var L = ['miami_causeway', 'miami_brickell', 'miami_oceandrive', 'miami_rocket'];
        var i = Math.floor(Math.random() * L.length);
        var im = new Image();
        im.className = 'lart';
        im.alt = '';
        im.onload = function () { im.classList.add('in'); };
        im.src = 'loading/' + L[i] + '.webp';
        var box = document.getElementById('loading');
        box.insertBefore(im, box.firstChild);
      })();
    </script>
    <script type="module" src="/src/openworld/main.ts"></script>
  </body>
</html>
