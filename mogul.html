<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mogul</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #f3e8d4; overflow: hidden; touch-action: none; }
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; color: #23201b; font-family: "Fredoka", system-ui, sans-serif; transition: opacity 0.6s ease;
        background: radial-gradient(70% 60% at 50% 30%, #fff6e3, #f0dfbf); }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .lwrap { text-align: center; width: min(520px, 86vw); }
      #loading .logo { font-size: clamp(64px, 11vw, 120px); font-weight: 700; letter-spacing: -0.04em; line-height: 0.9; }
      #loading .logo b { color: #f2a91c; }
      #loading .lbar { margin: 28px auto 0; width: 60%; height: 8px; background: rgba(35, 32, 27, 0.1); border-radius: 4px; overflow: hidden; }
      #loading .lbar b { display: block; height: 100%; width: 0; background: #ffc83d; transition: width 0.3s ease; }
      #loading .lstep { margin-top: 12px; font-size: 15px; color: rgba(35, 32, 27, 0.6); }
      #loading .lerr { margin-top: 12px; color: #a3301e; font: 12px/1.4 monospace; white-space: pre-wrap; max-height: 40vh; overflow: auto; text-align: left; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <div class="lwrap">
        <div class="logo">Mo<b>gul</b></div>
        <div class="lbar"><b></b></div>
        <div class="lstep">Loading</div>
        <div class="lerr"></div>
      </div>
    </div>
    <script type="module" src="/src/mogul/main.ts"></script>
  </body>
</html>
