<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Marble Mania</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #2a1a10; overflow: hidden; touch-action: none; }
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; color: #fff8ec; font-family: "Arial Rounded MT Bold", "Arial Black", sans-serif; transition: opacity 0.7s ease;
        background:
          radial-gradient(120% 80% at 50% 120%, rgba(255, 120, 60, 0.35), transparent 60%),
          repeating-linear-gradient(90deg, #8a5a32 0 46px, #7d5029 46px 48px, #946338 48px 96px, #82552e 96px 98px),
          #8a5a32; }
      #loading::before { content: ""; position: absolute; inset: 0; background: repeating-radial-gradient(ellipse 140% 18% at 30% 50%, rgba(60, 30, 10, 0.0) 0 9px, rgba(60, 30, 10, 0.12) 10px 12px); pointer-events: none; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .lwrap { position: relative; text-align: center; width: min(520px, 86vw); }
      #loading .logo { font-size: clamp(54px, 10vw, 104px); line-height: 0.9; letter-spacing: 0.01em; color: #ffd23a; text-shadow: 0 6px 0 #c2410c, 0 10px 0 #5a2a10, 0 18px 30px rgba(0, 0, 0, 0.45); transform: rotate(-3deg); }
      #loading .logo span { display: block; color: #fff; text-shadow: 0 6px 0 #2f74ff, 0 10px 0 #1a2a6a, 0 18px 30px rgba(0, 0, 0, 0.45); }
      #loading .balls { margin: 26px auto 0; display: flex; gap: 12px; justify-content: center; }
      #loading .balls i { width: 22px; height: 22px; border-radius: 50%; display: block; box-shadow: inset -4px -5px 8px rgba(0, 0, 0, 0.35), inset 4px 4px 6px rgba(255, 255, 255, 0.6); animation: lb 0.9s ease-in-out infinite; }
      #loading .balls i:nth-child(1) { background: #ff3a4a; }
      #loading .balls i:nth-child(2) { background: #2f9bff; animation-delay: 0.12s; }
      #loading .balls i:nth-child(3) { background: #ffd23a; animation-delay: 0.24s; }
      #loading .balls i:nth-child(4) { background: #37c25a; animation-delay: 0.36s; }
      @keyframes lb { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px); } }
      #loading .lbar { margin: 26px auto 0; width: 70%; height: 12px; background: rgba(40, 20, 8, 0.55); border-radius: 8px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5); }
      #loading .lbar b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffd23a, #ff8a1f); border-radius: 8px; transition: width 0.2s ease; }
      #loading .lstep { margin-top: 12px; font-size: 15px; color: rgba(255, 248, 236, 0.85); }
      #loading .lerr { margin-top: 12px; color: #ffd0d0; font: 12px/1.4 monospace; white-space: pre-wrap; max-height: 40vh; overflow: auto; text-align: left; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <div class="lwrap">
        <div class="logo">Marble<span>Mania</span></div>
        <div class="balls"><i></i><i></i><i></i><i></i></div>
        <div class="lbar"><b></b></div>
        <div class="lstep">Sanding the planks</div>
        <div class="lerr"></div>
      </div>
    </div>
    <script type="module" src="/src/marbles/main.ts"></script>
  </body>
</html>
