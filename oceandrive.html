<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Ocean Drive · Miami Beach</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
      #loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; color: #fff; font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
        background: linear-gradient(180deg, #f6b48a 0%, #f08aa8 34%, #6a5aa8 70%, #1c1f3a 100%); transition: opacity 1s ease; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .lwrap { position: absolute; left: 7vw; bottom: 13vh; width: min(560px, 82vw); }
      #loading .eyebrow { text-shadow: 0 1px 10px rgba(80,20,60,.55); font-size: 14px; letter-spacing: .34em; text-transform: uppercase; font-weight: 700; opacity: .85; }
      #loading .logo { margin-top: 22px; font-size: clamp(56px, 9vw, 118px); font-weight: 800; font-style: italic; line-height: .84; letter-spacing: -0.02em; text-transform: uppercase; text-shadow: 0 0 .25em rgba(255, 90, 160, .55); }
      #loading .sub { margin-top: 16px; font-size: 18px; font-weight: 600; max-width: 460px; line-height: 1.35; opacity: .9; }
      #loading .lbar { margin-top: 26px; height: 3px; background: rgba(255, 255, 255, .25); border-radius: 2px; overflow: hidden; }
      #loading .lbar b { display: block; height: 100%; width: 0; background: #fff; transition: width .25s ease; }
      #loading .lstep { margin-top: 12px; font-size: 14px; letter-spacing: .08em; font-weight: 600; opacity: .75; }
      #loading .lerr { margin-top: 12px; color: #fff; font: 12px/1.4 monospace; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="loading">
      <div class="lwrap">
        <div class="eyebrow">Miami Beach · 7th to 8th Street</div>
        <div class="logo">Ocean<br />Drive</div>
        <div class="sub">One block of South Beach, built from the map: the Art Deco hotels, Lummus Park, the sand and the Atlantic.</div>
        <div class="lbar"><b></b></div>
        <div class="lstep">Starting</div>
        <div class="lerr"></div>
      </div>
    </div>
    <script type="module" src="/src/oceandrive/main.ts"></script>
  </body>
</html>
