<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tracksmith</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #15161c; overflow: hidden; touch-action: none; }
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; color: #fff6e8; font-family: "Arial Black", sans-serif; transition: opacity 0.6s ease;
        background: linear-gradient(180deg, #4f86c6 0%, #ffd6a8 62%, #e3b27c 62%, #d9a36c 100%); }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .lwrap { text-align: center; width: min(520px, 86vw); }
      #loading .logo { font-size: clamp(54px, 10vw, 100px); line-height: 0.86; text-shadow: 0 6px 0 rgba(0, 0, 0, 0.25); }
      #loading .logo span { display: block; color: #ff5a3c; }
      #loading .road { margin: 28px auto 0; height: 26px; width: 80%; background: #3a3d46; position: relative; overflow: hidden; border-radius: 4px; box-shadow: 0 8px 0 #dcc6a2; }
      #loading .road::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; background: repeating-linear-gradient(90deg, #f5e9cf 0 24px, transparent 24px 48px); animation: dash 0.5s linear infinite; }
      @keyframes dash { to { transform: translateX(-48px); } }
      #loading .lbar { margin: 22px auto 0; width: 60%; height: 8px; background: rgba(0, 0, 0, 0.2); border-radius: 6px; overflow: hidden; }
      #loading .lbar b { display: block; height: 100%; width: 0; background: #ff5a3c; transition: width 0.2s ease; }
      #loading .lerr { margin-top: 12px; color: #fff; font: 12px/1.4 monospace; white-space: pre-wrap; max-height: 40vh; overflow: auto; text-align: left; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <div class="lwrap">
        <div class="logo">Track<span>smith</span></div>
        <div class="road"></div>
        <div class="lbar"><b></b></div>
        <div class="lerr"></div>
      </div>
    </div>
    <script type="module" src="/src/tracksmith/main.ts"></script>
  </body>
</html>
