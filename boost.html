<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Boostball</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #03060f; overflow: hidden; touch-action: none; }
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; color: #e9f0ff; font-family: "Titillium Web", "Arial Narrow", Arial, sans-serif; transition: opacity 0.7s ease;
        background: radial-gradient(70% 55% at 20% 100%, rgba(47, 123, 255, 0.32), transparent 60%), radial-gradient(70% 55% at 80% 100%, rgba(255, 122, 31, 0.28), transparent 60%), #03060f; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .lwrap { text-align: center; width: min(560px, 86vw); }
      #loading .logo { font-size: clamp(60px, 11vw, 120px); font-weight: 900; font-style: italic; letter-spacing: -0.04em; line-height: 0.9; }
      #loading .logo b { color: #2f7bff; }
      #loading .logo i { color: #ff7a1f; }
      #loading .lbar { margin: 30px auto 0; width: 70%; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 4px; overflow: hidden; transform: skewX(-20deg); }
      #loading .lbar b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2f7bff, #ff7a1f); box-shadow: 0 0 14px #2f7bff; transition: width 0.25s ease; }
      #loading .lstep { margin-top: 14px; font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(233, 240, 255, 0.6); }
      #loading .lerr { margin-top: 12px; color: #ffd0d0; font: 12px/1.4 monospace; white-space: pre-wrap; max-height: 40vh; overflow: auto; text-align: left; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <div class="lwrap">
        <div class="logo"><b>BOOST</b><i>BALL</i></div>
        <div class="lbar"><b></b></div>
        <div class="lstep">Loading</div>
        <div class="lerr"></div>
      </div>
    </div>
    <script type="module" src="/src/boost/main.ts"></script>
  </body>
</html>
