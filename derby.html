<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Marble Derby</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #05030c; overflow: hidden; touch-action: none; }
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; color: #f6f1ff; font-family: "Arial Rounded MT Bold", "Arial Black", sans-serif; transition: opacity 0.7s ease;
        background: radial-gradient(80% 60% at 50% 110%, rgba(255, 47, 154, 0.28), transparent 60%), radial-gradient(60% 50% at 50% -10%, rgba(42, 216, 255, 0.18), transparent 60%), #05030c; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .lwrap { text-align: center; width: min(520px, 86vw); }
      #loading .logo { font-size: clamp(54px, 10vw, 100px); line-height: 0.95; letter-spacing: 0.01em; color: #fff; text-shadow: 0 0 8px #2ad8ff, 0 0 26px #2ad8ff; }
      #loading .logo span { display: block; color: #ffd7ef; text-shadow: 0 0 8px #ff2f9a, 0 0 30px #ff2f9a, 0 0 60px rgba(255, 47, 154, 0.6); }
      #loading .bulbs { margin: 26px auto 0; display: flex; gap: 10px; justify-content: center; }
      #loading .bulbs i { width: 12px; height: 12px; border-radius: 50%; background: #ffcf3a; box-shadow: 0 0 10px #ffcf3a; animation: bl 1s steps(1) infinite; }
      #loading .bulbs i:nth-child(2n) { animation-delay: 0.5s; }
      @keyframes bl { 50% { opacity: 0.2; box-shadow: none; } }
      #loading .lbar { margin: 26px auto 0; width: 70%; height: 8px; background: rgba(255, 255, 255, 0.08); border-radius: 6px; overflow: hidden; }
      #loading .lbar b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2ad8ff, #ff2f9a); box-shadow: 0 0 12px #ff2f9a; transition: width 0.2s ease; }
      #loading .lstep { margin-top: 12px; font-size: 15px; color: rgba(246, 241, 255, 0.7); }
      #loading .lerr { margin-top: 12px; color: #ffd0d0; font: 12px/1.4 monospace; white-space: pre-wrap; max-height: 40vh; overflow: auto; text-align: left; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <div class="lwrap">
        <div class="logo">Marble<span>Derby</span></div>
        <div class="bulbs"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="lbar"><b></b></div>
        <div class="lstep">Opening the gates</div>
        <div class="lerr"></div>
      </div>
    </div>
    <script type="module" src="/src/derby/main.ts"></script>
  </body>
</html>
